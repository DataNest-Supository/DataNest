<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONSAS Scene Song Spark</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><p class="eyebrow">DATANEST · PRODUCTS · RONSAS</p><h1>Scene Song Spark</h1><p>Shape a song or story concept into a timed visual sequence you can hand off to production.</p></header><section class="grid"><form id="spark" class="panel"><label>Concept<textarea id="concept" required placeholder="A lone traveler finds a signal in the desert"></textarea></label><label>Mood<input id="mood" value="cinematic"></label><label>Total duration (seconds)<input id="duration" type="number" min="10" value="60"></label><label>Scenes<input id="count" type="number" min="1" max="12" value="6"></label><button type="submit">Spark scenes</button></form><section class="panel"><div class="head"><h2>Scene sequence</h2><button id="copy" type="button" disabled>Copy JSON</button></div><div id="result" class="muted">Add a concept to begin.</div></section></section><footer>Source authority: DataNest-Supository/DataNest · Free promotion</footer></main><script type="module" src="./app.js"></script></body></html>
