name: Sync RONSAS consolidation with main

on:
  push:
    branches:
      - migrate/ronsas-applications-into-datanest-20260927
    paths:
      - ".github/workflows/sync-ronsas-consolidation.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: migrate/ronsas-applications-into-datanest-20260927
          fetch-depth: 0
      - name: Merge current main without weakening RONSAS gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:migrate/ronsas-applications-into-datanest-20260927
