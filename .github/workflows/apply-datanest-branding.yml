name: Apply DataNest branding patch

on:
  push:
    paths:
      - ".github/workflows/apply-datanest-branding.yml"

permissions:
  contents: write

jobs:
  patch-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace sidebar branding and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/DataNestApp.tsx")
          text = path.read_text()
          old = '        <div><p className="eyebrow">RESON8.DATANEST.LIFE</p><b>DataNest</b></div>'
          new = '        <div><b>Resonance Data Nest</b></div>'
          if old not in text:
              raise SystemExit("Expected sidebar branding block not found")
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/apply-datanest-branding.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DataNestApp.tsx .github/workflows/apply-datanest-branding.yml
          git commit -m "Simplify DataNest sidebar branding"
          git push
