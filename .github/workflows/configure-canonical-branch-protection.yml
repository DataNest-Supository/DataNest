name: Configure canonical branch protection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-canonical-branch-protection.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply main branch protection
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN_PRESENT: ${{ secrets.GITHUB_ADMIN_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.REPO_ADMIN_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_ADMIN_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.REPO_ADMIN_TOKEN || github.token }}
          script: |
            const requiredChecks = [
              "CI",
              "PR Verification",
              "Security scan",
              "DataNest AI Certification",
              "DataNest Boundaries",
              "ENFORCER Defence Tree",
              "GUARDIAN Health & Healing Tree",
              "CALMER Governance Softening Tree",
              "REGULATOR Harmony Tree",
              "VISIBILITY-UTILITY Market Presence Tree"
            ];

            await github.request("PUT /repos/{owner}/{repo}/branches/{branch}/protection", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
              required_status_checks: {
                strict: true,
                contexts: requiredChecks
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1,
                require_last_push_approval: true
              },
              restrictions: null,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: false,
              required_conversation_resolution: true,
              lock_branch: false,
              allow_fork_syncing: false,
              headers: {
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });

            core.info("MAIN_BRANCH_PROTECTION_APPLIED=true");
            core.info("ADMIN_TOKEN_SECRET_AVAILABLE=" + Boolean(process.env.ADMIN_TOKEN_PRESENT));
            core.info("REQUIRED_CHECK_COUNT=" + requiredChecks.length);
