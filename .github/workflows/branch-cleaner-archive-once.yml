name: Archive Remaining Frozen Merged Head

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleaner-archive-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: ${{ github.event.head_commit.message == 'Archive remaining frozen merged head' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Revalidate exact merged head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ui/datanest-navigation-density-20260927"
          expected_sha="6408492fbe27929b06c939f1616b277614c5f961"
          pr="124"
          OWNER="${REPO%%/*}"
          encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
          branch_json=$(gh api "repos/$REPO/branches/$encoded")
          actual_sha=$(printf '%s' "$branch_json" | jq -r '.commit.sha')
          protected=$(printf '%s' "$branch_json" | jq -r '.protected')
          [ "$actual_sha" = "$expected_sha" ] || { echo "Branch tip moved"; exit 2; }
          [ "$protected" = "false" ] || { echo "Branch is protected"; exit 2; }
          open_prs=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$branch" --jq 'length')
          [ "$open_prs" = "0" ] || { echo "Open PR exists"; exit 2; }
          pr_json=$(gh api "repos/$REPO/pulls/$pr")
          merged_at=$(printf '%s' "$pr_json" | jq -r '.merged_at // empty')
          pr_head=$(printf '%s' "$pr_json" | jq -r '.head.ref')
          pr_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')
          [ -n "$merged_at" ] && [ "$pr_head" = "$branch" ] && [ "$pr_sha" = "$expected_sha" ] || {
            echo "Merged PR head does not prove the frozen tip"
            exit 2
          }
          tag="branch-archive/$branch"
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
          if [ -n "$existing" ]; then
            [ "$existing" = "$expected_sha" ] || { echo "Archive tag mismatch"; exit 2; }
            echo "Archive tag already exists at exact tip."
          else
            git tag "$tag" "$expected_sha"
            git push origin "refs/tags/$tag"
            echo "Archived $branch as $tag -> $expected_sha"
          fi
