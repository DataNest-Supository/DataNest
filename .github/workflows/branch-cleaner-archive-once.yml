name: Archive Frozen Merged Branch History

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleaner-archive-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: ${{ github.event.head_commit.message == 'Archive frozen merged branch heads' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Revalidate and archive exact merged heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          mkdir -p artifacts/branch-cleaner
          REPORT="artifacts/branch-cleaner/archive-frozen-merged-heads.md"
          archived=0
          already=0
          skipped=0
          failed=0
          {
            echo "# Frozen merged branch archive"
            echo
            echo "Main SHA: ${GITHUB_SHA}"
            echo
          } > "$REPORT"

          while IFS='|' read -r branch expected_sha pr; do
            [ -n "$branch" ] || continue
            encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")

            if ! branch_json=$(gh api "repos/$REPO/branches/$encoded" 2>/dev/null); then
              echo "- SKIP `$branch`: branch missing" | tee -a "$REPORT"
              skipped=$((skipped+1))
              continue
            fi

            actual_sha=$(printf '%s' "$branch_json" | jq -r '.commit.sha')
            protected=$(printf '%s' "$branch_json" | jq -r '.protected')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "- SKIP `$branch`: tip moved from expected $expected_sha to $actual_sha" | tee -a "$REPORT"
              skipped=$((skipped+1))
              continue
            fi
            if [ "$protected" = "true" ]; then
              echo "- SKIP `$branch`: protected" | tee -a "$REPORT"
              skipped=$((skipped+1))
              continue
            fi

            open_prs=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$branch" --jq 'length')
            if [ "$open_prs" != "0" ]; then
              echo "- SKIP `$branch`: open PR exists" | tee -a "$REPORT"
              skipped=$((skipped+1))
              continue
            fi

            pr_json=$(gh api "repos/$REPO/pulls/$pr")
            merged_at=$(printf '%s' "$pr_json" | jq -r '.merged_at // empty')
            pr_head=$(printf '%s' "$pr_json" | jq -r '.head.ref')
            pr_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')
            if [ -z "$merged_at" ] || [ "$pr_head" != "$branch" ] || [ "$pr_sha" != "$expected_sha" ]; then
              echo "- SKIP `$branch`: merged PR head no longer proves exact frozen tip" | tee -a "$REPORT"
              skipped=$((skipped+1))
              continue
            fi

            tag="branch-archive/$branch"
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
            if [ -n "$existing" ]; then
              if [ "$existing" = "$expected_sha" ]; then
                echo "- EXISTS `$tag` -> $expected_sha" | tee -a "$REPORT"
                already=$((already+1))
                continue
              fi
              echo "- FAIL `$tag`: existing tag points to $existing, expected $expected_sha" | tee -a "$REPORT"
              failed=$((failed+1))
              continue
            fi

            git tag "$tag" "$expected_sha"
            git push origin "refs/tags/$tag"
            echo "- ARCHIVED `$branch` as `$tag` -> $expected_sha (PR #$pr)" | tee -a "$REPORT"
            archived=$((archived+1))
          done <<'CANDIDATES'
