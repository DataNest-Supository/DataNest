name: Phase D Migration Name Generator

on:
  push:
    branches:
      - feature/datanest-phase-d-authority-execution-controls
    paths:
      - ".github/workflows/phase-d-migration-name-generator.yml"
      - "docs/superpowers/specs/2026-09-27-datanest-phase-d-authority-execution-controls-design.md"
      - "docs/superpowers/plans/2026-09-27-datanest-phase-d-authority-execution-controls.md"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/datanest-phase-d-authority-execution-controls
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Generate Phase D migration files once
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_add_authority_execution_foundations.sql" > /dev/null; then
            echo "Phase D migration files already exist."
            exit 0
          fi
          supabase migration new add_authority_execution_foundations
          sleep 1
          supabase migration new add_authority_execution_governed_operations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate Phase D migration files"
          git push origin HEAD:feature/datanest-phase-d-authority-execution-controls
