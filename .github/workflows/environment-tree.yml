name: ENVIRONMENT Tree

on:
  schedule:
    - cron: "7 */6 * * *"
      timezone: Africa/Johannesburg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datanest-environment-tree
  cancel-in-progress: true

jobs:
  assess-and-adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated ENVIRONMENT feed branch
        shell: bash
        run: git switch -C automation/environment-feed

      - name: Assess compatibility and apply safe generated adaptations
        run: node scripts/environment-assessor.mjs

      - name: Publish environment state and feeds
        shell: bash
        run: |
          set -euo pipefail
          git add environment/state/latest.json environment/feeds/
          if git diff --cached --quiet; then
            echo "ENVIRONMENT state unchanged."
            exit 0
          fi
          git -c user.name="DataNest ENVIRONMENT"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "Refresh DataNest ENVIRONMENT assessment"
          git push --force-with-lease origin HEAD:automation/environment-feed

      - uses: actions/upload-artifact@v4
        with:
          name: environment-assessment-${{ github.run_id }}
          path: environment/state/latest.json
          retention-days: 30
