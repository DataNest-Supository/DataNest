name: Phase F Migration Name Generator

on:
  push:
    branches:
      - feature/datanest-phase-f-intelligence-fabric
    paths:
      - ".github/workflows/phase-f-migration-name-generator.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/datanest-phase-f-intelligence-fabric
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Generate Phase F migration files once
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_add_intelligence_fabric_foundations.sql" > /dev/null; then
            echo "Phase F migration files already exist."
            exit 0
          fi
          supabase migration new add_intelligence_fabric_foundations
          sleep 1
          supabase migration new add_intelligence_fabric_governed_operations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate Phase F migration files"
          git push origin HEAD:feature/datanest-phase-f-intelligence-fabric
