name: Branch-Cleaner Current Apply

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleaner-audit-current.yml"
      - ".github/branch-cleaner/supabase-verified-snapshot.json"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'Apply Branch-Cleaner current safe cleanup' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify Branch-Cleaner unit tests
        run: node --test tests/unit/branch-cleaner.test.mjs
      - name: Apply strict safe cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/branch-cleaner.mjs --strict --apply
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: branch-cleaner-current-apply
          path: artifacts/branch-cleaner/
          if-no-files-found: error
