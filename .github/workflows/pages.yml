name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DATANEST_STATIC_EXPORT: "true"
      NEXT_PUBLIC_BASE_PATH: "/DataNest"
      NEXT_PUBLIC_SUPABASE_URL: "https://sgqdmfgjbprsoqsmgigi.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_yIf5HFKNNteed4HdYCS2Vw_4TB-4LvB"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: node scripts/write-runtime-config.mjs public/runtime-config.js
        env:
          SUPABASE_URL: "https://sgqdmfgjbprsoqsmgigi.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_yIf5HFKNNteed4HdYCS2Vw_4TB-4LvB"
      - name: Write release manifest
        env:
          DATANEST_RELEASE_SHA: ${{ github.sha }}
          DATANEST_DB_RELEASE: datanest-sparks-economy-v1
          DATANEST_BASELINE_RELEASE: reload-latest-v1
          DATANEST_BASELINE_SHA: 592149b0898f6703b28e9fa33e73bd0799cae3fd
          DATANEST_EDGE_AI: datanest-ai-chat@1
          DATANEST_EDGE_INTAKE: datanest-ai-intake@1
          DATANEST_EDGE_CERTIFICATION: datanest-ai-certification@1
          DATANEST_EDGE_PROVIDER: manage-ai-provider-v2@1
          DATANEST_EDGE_INVITES: send-job-invite@1
        run: node scripts/write-release-manifest.mjs public/release-manifest.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify:
    name: Verify live Pages deployment
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify deployed Next.js shell
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            https://datanest-supository.github.io/DataNest/ \
            -o /tmp/datanest-home.html
          grep -q "Resonance DataNest" /tmp/datanest-home.html
          if ! grep -q 'class="authShell"' /tmp/datanest-home.html; then
            echo "Expected Next.js auth shell was not served. Live HTML prefix:"
            head -c 2000 /tmp/datanest-home.html
            exit 1
          fi
          PAGE_ASSET=$(grep -o '/DataNest/_next/static/chunks/app/page-[^"]*\.js' /tmp/datanest-home.html | head -1)
          test -n "$PAGE_ASSET"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://datanest-supository.github.io$PAGE_ASSET" \
            -o /tmp/datanest-page.js
          test -s /tmp/datanest-page.js
      - name: Verify static health marker
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            https://datanest-supository.github.io/DataNest/health.json \
            -o /tmp/datanest-health.json
          grep -q '"ok":true' /tmp/datanest-health.json
          grep -q '"project":"Resonance DataNest"' /tmp/datanest-health.json
      - name: Verify runtime configuration
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            https://datanest-supository.github.io/DataNest/runtime-config.js \
            -o /tmp/runtime-config.js
          grep -q "https://sgqdmfgjbprsoqsmgigi.supabase.co" /tmp/runtime-config.js
          grep -q "sb_publishable_" /tmp/runtime-config.js
          grep -q "authoritative" /tmp/runtime-config.js
      - name: Verify release manifest
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            https://datanest-supository.github.io/DataNest/release-manifest.json \
            -o /tmp/release-manifest.json
          grep -q "\"frontendCommit\":\"$GITHUB_SHA\"" /tmp/release-manifest.json
          grep -q "\"databaseRelease\":\"datanest-sparks-economy-v1\"" /tmp/release-manifest.json
          grep -q "\"release\":\"reload-latest-v1\"" /tmp/release-manifest.json
          grep -q "\"frontendCommit\":\"592149b0898f6703b28e9fa33e73bd0799cae3fd\"" /tmp/release-manifest.json
          grep -q "\"aiChat\":\"datanest-ai-chat@1\"" /tmp/release-manifest.json
          grep -q "\"externalIntake\":\"datanest-ai-intake@1\"" /tmp/release-manifest.json
          grep -q "\"certification\":\"datanest-ai-certification@1\"" /tmp/release-manifest.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run rendered browser smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://datanest-supository.github.io
          DATANEST_APP_PATH: /DataNest/
        run: npx playwright test tests/browser/auth.smoke.spec.ts
