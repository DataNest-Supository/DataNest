name: Apply live auth branding

on:
  push:
    branches: [fix/live-auth-branding-20260928]
    paths:
      - .github/workflows/apply-live-auth-branding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-auth-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Align public and authenticated branding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/AuthGate.tsx")
          text = path.read_text()
          replacements = [
              ('<div className="authBrand" aria-label="reson8.datanest.life brand">', '<div className="authBrand" aria-label="Resonance Data Nest brand">'),
              ('<span className="authBrandCopy"><small>RESON8</small><strong>datanest.life</strong></span>', '<span className="authBrandCopy"><strong>Resonance Data Nest</strong></span>'),
              ('<a className="landingBrand" href="#" aria-label="reson8.datanest.life home"><span className="landingLogo" aria-hidden="true"><img src={DATANEST_LOGO_SRC} alt="" /></span><span className="landingBrandText"><small>RESON8</small><b>datanest.life</b></span></a>', '<a className="landingBrand" href="#" aria-label="Resonance Data Nest home"><span className="landingLogo" aria-hidden="true"><img src={DATANEST_LOGO_SRC} alt="" /></span><span className="landingBrandText"><b>Resonance Data Nest</b></span></a>'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthGate.tsx
          git diff --cached --check
          git commit -m "Align public DataNest branding"
          git push origin HEAD:main
