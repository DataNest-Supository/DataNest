name: CONDUCTOR Process Synchronization Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
      timezone: Africa/Johannesburg
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Knowledge Tree"
      - "ENVIRONMENT Tree"
      - "Security scan"
      - "DataNest Boundaries"
      - "ENFORCER Defence Tree"
      - "BOTSQUAD AI Tree"
      - "GUARDIAN Health & Healing Tree"
      - "DataNest Maintenance"
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: datanest-conductor
  cancel-in-progress: true

jobs:
  coordinate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    name: Synchronize tree timing and commands
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read prior coordination and SUGGESTER state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/conductor
          git fetch origin automation/conductor || true
          git fetch origin automation/suggester || true
          git show origin/automation/conductor:conductor/state/latest.json > /tmp/conductor/previous.json 2>/dev/null || echo 'null' > /tmp/conductor/previous.json
          git show origin/automation/suggester:suggester/feeds/datanest.json > /tmp/conductor/suggester.json 2>/dev/null || echo '{}' > /tmp/conductor/suggester.json
          git switch -C automation/conductor

      - name: Build synchronized process command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONDUCTOR_PREVIOUS_PATH: /tmp/conductor/previous.json
          CONDUCTOR_SUGGESTER_PATH: /tmp/conductor/suggester.json
        run: node scripts/conductor-orchestrator.mjs

      - name: Publish CONDUCTOR state
        shell: bash
        run: |
          set -euo pipefail
          git add conductor/state/latest.json conductor/commands/latest.json
          if ! git diff --cached --quiet; then
            git -c user.name="DataNest CONDUCTOR"                 -c user.email="41898282+github-actions[bot]@users.noreply.github.com"                 commit -m "Refresh CONDUCTOR process synchronization"
            git push --force-with-lease origin HEAD:automation/conductor
          fi

      - name: Dispatch next synchronized command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(jq -r '.nextCommand.workflow // empty' conductor/commands/latest.json)"
          type="$(jq -r '.nextCommand.type // empty' conductor/commands/latest.json)"
          if [ -z "$workflow" ]; then
            echo "No CONDUCTOR dispatch selected."
            exit 0
          fi

          echo "CONDUCTOR dispatch: $type -> $workflow"
          case "$workflow" in
            maintenance.yml)
              task="$(jq -r '.nextCommand.inputs.task // "branch-cleaner"' conductor/commands/latest.json)"
              gh workflow run "$workflow" --ref main -f task="$task"
              ;;
            suggester.yml)
              gh workflow run "$workflow" --ref main -f conductor_run_id="$GITHUB_RUN_ID"
              ;;
            *)
              gh workflow run "$workflow" --ref main
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conductor-state-${{ github.run_id }}
          path: |
            conductor/state/latest.json
            conductor/commands/latest.json
          retention-days: 30

  gate-timeframe:
    name: DataNest AI worktree gate timeframe
    uses: ./.github/workflows/worktree-gate-timeframe.yml
    with:
      gate_id: "conductor"
