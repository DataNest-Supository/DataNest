name: DataNest Maintenance

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: Africa/Johannesburg
    - cron: "37 4 * * 0"
      timezone: Africa/Johannesburg
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        type: choice
        required: true
        default: all
        options: [all, branch-cleaner, streamliner]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: datanest-maintenance
  cancel-in-progress: false

jobs:
  branch-cleaner:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'branch-cleaner')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safe autonomous branch cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/branch-cleaner.mjs --git-only-safe-apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datanest-branch-cleaner-${{ github.run_id }}
          path: artifacts/branch-cleaner/
          retention-days: 30

  streamliner:
    if: github.event_name == 'schedule' && github.event.schedule == '37 4 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'streamliner')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic safe refinements
        run: node scripts/workflow-reviewer.mjs --apply
      - name: Open maintenance pull request when tracked files changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked safe refinements."
            exit 0
          fi
          branch="maintenance/datanest-streamline-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "chore: scheduled DataNest streamlining"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Scheduled DataNest streamlining" --body "Automated deterministic maintenance. Canonical human review remains required."
