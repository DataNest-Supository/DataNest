name: Repair SyncVision canonical assets

on:
  push:
    branches:
      - migrate/ronsas-applications-into-datanest-20260927
    paths:
      - ".github/workflows/repair-syncvision-assets.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Recover only exact canonical SyncVision assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdir, writeFile } from "node:fs/promises";
          import { dirname } from "node:path";

          const bases = [
            "https://syncvision.life",
            "https://www.syncvision.life",
          ];

          const targets = [
            {
              path: "apps/ronsas/syncvision/public/ffmpeg-core/ffmpeg-core.wasm",
              sha: "8988d43ccefd178a8ab9a1f79f284d01a16dd32f",
              size: 32129114,
              urls: bases.map((base) => `${base}/ffmpeg-core/ffmpeg-core.wasm`),
            },
            {
              path: "apps/ronsas/syncvision/public/og-v2.png",
              sha: "168eacf216ea00e37667ec583f04697f7d64bf24",
              size: 1746155,
              urls: bases.map((base) => `${base}/og-v2.png`),
            },
            {
              path: "apps/ronsas/syncvision/public/og-v3.png",
              sha: "3c8e3f5283049b4fc805abfa84365ef30cc2d4f9",
              size: 1620052,
              urls: bases.map((base) => `${base}/og-v3.png`),
            },
            {
              path: "apps/ronsas/syncvision/src/assets/resonance-app-dev-logo.png",
              sha: "7fe2a0ca3b270c0f09321b29c7f0fc83d3766778",
              size: 1833523,
              urls: bases.flatMap((base) => [
                `${base}/resonance-app-dev-logo.png`,
                `${base}/assets/resonance-app-dev-logo.png`,
              ]),
            },
          ];

          function gitBlobSha(buf) {
            const header = Buffer.from(`blob ${buf.length}\0`);
            return createHash("sha1").update(header).update(buf).digest("hex");
          }

          async function fetchBuffer(url) {
            const response = await fetch(url, {
              redirect: "follow",
              headers: { "user-agent": "DataNest-RONSAS-migration" },
            });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            return Buffer.from(await response.arrayBuffer());
          }

          async function addDiscoveredLogoCandidates() {
            const logo = targets.find((target) => target.path.endsWith("resonance-app-dev-logo.png"));
            const seen = new Set(logo.urls);
            for (const base of bases) {
              try {
                const html = (await fetchBuffer(`${base}/`)).toString("utf8");
                const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/gi)]
                  .map((match) => new URL(match[1], base).href);
                for (const scriptUrl of scripts) {
                  try {
                    const js = (await fetchBuffer(scriptUrl)).toString("utf8");
                    const matches = js.match(/(?:https?:\\?\/\\?\/[^"'\\s`]+|\/?assets\/[^"'\\s`]+)?resonance-app-dev-logo[^"'\\s`]*\.png/gi) || [];
                    for (const value of matches) {
                      const normalized = value.replaceAll("\\/", "/");
                      const candidate = new URL(normalized, base).href;
                      if (!seen.has(candidate)) {
                        seen.add(candidate);
                        logo.urls.push(candidate);
                      }
                    }
                  } catch (error) {
                    console.log(`Skip script ${scriptUrl}: ${error.message}`);
                  }
                }
              } catch (error) {
                console.log(`Skip site discovery at ${base}: ${error.message}`);
              }
            }
          }

          await addDiscoveredLogoCandidates();

          const failures = [];
          for (const target of targets) {
            let restored = false;
            for (const url of target.urls) {
              try {
                const buf = await fetchBuffer(url);
                const sha = gitBlobSha(buf);
                console.log(`${target.path}: candidate ${url} => ${buf.length} bytes, git blob ${sha}`);
                if (buf.length === target.size && sha === target.sha) {
                  await mkdir(dirname(target.path), { recursive: true });
                  await writeFile(target.path, buf);
                  console.log(`RESTORED exact canonical asset: ${target.path}`);
                  restored = true;
                  break;
                }
              } catch (error) {
                console.log(`${target.path}: candidate ${url} unavailable: ${error.message}`);
              }
            }
            if (!restored) failures.push(target.path);
          }

          if (failures.length) {
            throw new Error(`No exact canonical public candidate found for: ${failures.join(", ")}`);
          }
          NODE

      - name: Verify canonical Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object apps/ronsas/syncvision/public/ffmpeg-core/ffmpeg-core.wasm)" = "8988d43ccefd178a8ab9a1f79f284d01a16dd32f"
          test "$(git hash-object apps/ronsas/syncvision/public/og-v2.png)" = "168eacf216ea00e37667ec583f04697f7d64bf24"
          test "$(git hash-object apps/ronsas/syncvision/public/og-v3.png)" = "3c8e3f5283049b4fc805abfa84365ef30cc2d4f9"
          test "$(git hash-object apps/ronsas/syncvision/src/assets/resonance-app-dev-logo.png)" = "7fe2a0ca3b270c0f09321b29c7f0fc83d3766778"
          node scripts/validate-ronsas-imports.mjs

      - name: Commit exact SyncVision asset repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ronsas/syncvision/public/ffmpeg-core/ffmpeg-core.wasm \
                  apps/ronsas/syncvision/public/og-v2.png \
                  apps/ronsas/syncvision/public/og-v3.png \
                  apps/ronsas/syncvision/src/assets/resonance-app-dev-logo.png
          if git diff --cached --quiet; then
            echo "No SyncVision asset changes required."
            exit 0
          fi
          git commit -m "Restore exact SyncVision canonical assets"
          git push origin HEAD:migrate/ronsas-applications-into-datanest-20260927
