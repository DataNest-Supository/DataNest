name: BRANCH-X Canonical Write Watchdog

on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  detect:
    name: BRANCH-X Canonical Write Watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect canonical push provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical-write/state

          if [ "$REF" = "refs/heads/main" ] && [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            cat > canonical-write/state/result.json <<'JSON'
          {"schemaVersion":"datanest-canonical-write-watchdog-v1","result":"bootstrap","reason":"initial branch creation event"}
          JSON
            exit 0
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" \
            > canonical-write/state/associated-prs.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          prs=json.loads(Path("canonical-write/state/associated-prs.json").read_text())
          merged=[p for p in prs if p.get("merged_at")]
          evidence={
              "schemaVersion":"datanest-canonical-write-watchdog-v1",
              "repository":os.environ["REPO"],
              "ref":os.environ["REF"],
              "sha":os.environ["SHA"],
              "associatedPullRequests":[
                  {"number":p.get("number"),"state":p.get("state"),"merged_at":p.get("merged_at"),"base_ref":(p.get("base") or {}).get("ref")}
                  for p in prs
              ],
              "mergedPullRequests":[
                  {"number":p.get("number"),"merged_at":p.get("merged_at"),"base_ref":(p.get("base") or {}).get("ref")}
                  for p in merged
              ],
              "result":"authorized-merge-provenance" if merged else "canonical-write-anomaly"
          }
          Path("canonical-write/state/result.json").write_text(json.dumps(evidence,indent=2)+"\n")
          print(json.dumps(evidence,indent=2))
          if not merged:
              print("::error::No associated merged pull request was found for this canonical push.")
              raise SystemExit(1)
          PY

      - name: Open or update governance incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title_prefix="BRANCH-X canonical write anomaly: $REF"
          body="Detected an unassociated canonical push to $REF at $SHA. This is a detection-only governance alert; native GitHub protection remains the control that prevents direct writes. Review the workflow evidence and enable the BRANCH-X native rulesets if still unresolved."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=repo:$REPO+is:issue+is:open+in:title+BRANCH-X%20canonical%20write%20anomaly%20$REF" \
            > open-incidents.json

          python - "$title_prefix" "$body" <<'PY' > issue.json
          import json, sys
          print(json.dumps({"body":sys.argv[2]}))
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("open-incidents.json").read_text())
          items=data.get("items", [])
          if items:
              Path("incident-mode.txt").write_text("update")
              Path("incident-number.txt").write_text(str(items[0]["number"]))
          else:
              Path("incident-mode.txt").write_text("create")
          PY

          if [ "$(cat incident-mode.txt)" = "update" ]; then
            number="$(cat incident-number.txt)"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/issues/$number/comments" \
              -d "$(python -c 'import json,sys; print(json.dumps({"body":open("issue.json").read()}))')" \
              || echo "::warning::Unable to update the existing governance incident."
          else
            python - "$REPO" "$title_prefix @ $SHA" "$body" <<'PY' > issue.json
            import json, sys
            print(json.dumps({"title":sys.argv[2],"body":sys.argv[3],"labels":["governance"]}))
            PY
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPO/issues \
              -d @issue.json \
              || echo "::warning::Unable to open governance incident automatically."
          fi

      - name: Upload canonical write evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: canonical-write-watchdog-${{ github.run_id }}
          path: canonical-write/state/
          retention-days: 90
