name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  SARIF_RETENTION_DAYS: ${{ vars.SARIF_RETENTION_DAYS || '14' }}
  SARIF_SUMMARY_TOP_N: ${{ vars.SARIF_SUMMARY_TOP_N || '10' }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Project security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Enforce DataNest source security invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const candidateRoots = ["src", "app", "components", "lib", "supabase/functions"];
          const roots = candidateRoots.filter((root) => fs.existsSync(root));
          const findings = [];
          const extensions = new Set([".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs"]);
          const skippedDirectories = new Set(["node_modules", ".next", "out", "coverage", "dist", "docs"]);

          if (roots.length === 0) {
            console.error("::error::No DataNest source roots found for security invariant scanning.");
            process.exit(1);
          }

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory() && skippedDirectories.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else if (extensions.has(path.extname(entry.name))) {
                inspect(full);
              }
            }
          }

          const secretPatterns = [
            ["supabase-service-role-jwt", /eyJhbGciOi[A-Za-z0-9_.-]{40,}/],
            ["supabase-secret-key", /\bsb_secret_[A-Za-z0-9_-]{20,}/],
            ["openai-key", /\bsk-[A-Za-z0-9]{32,}/],
            ["stripe-secret-key", /\bsk_live_[A-Za-z0-9]{20,}/],
            ["aws-access-key", /\bAKIA[0-9A-Z]{16}\b/],
            ["private-key-block", /-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----/],
          ];

          function add(file, line, rule, detail) {
            findings.push({ file: file.replaceAll("\\", "/"), line, rule, detail });
          }

          function inspect(file) {
            const src = fs.readFileSync(file, "utf8");
            const lines = src.split("\n");
            const isClientModule = /^\s*["']use client["'];/m.test(src);

            lines.forEach((line, index) => {
              const lineNumber = index + 1;

              for (const [name, pattern] of secretPatterns) {
                if (pattern.test(line)) {
                  add(file, lineNumber, "secret:" + name, "Hard-coded secret-like material in runtime source");
                }
              }

              if (/\beval\s*\(/.test(line) || /\bnew\s+Function\s*\(/.test(line)) {
                add(file, lineNumber, "eval-or-function-ctor", "Dynamic code execution is not allowed");
              }

              if (/dangerouslySetInnerHTML/.test(line)) {
                add(file, lineNumber, "dangerously-set-inner-html", "Raw HTML injection requires explicit security review");
              }

              if (
                isClientModule &&
                (/process\.env\.[A-Z0-9_]*(?:SERVICE_ROLE|SECRET|PRIVATE_KEY|DATABASE_URL|DB_PASSWORD)/.test(line) ||
                  /NEXT_PUBLIC_[A-Z0-9_]*(?:SERVICE_ROLE|SECRET|PRIVATE_KEY|DB_PASSWORD)/.test(line))
              ) {
                add(file, lineNumber, "server-secret-in-client", "Server-only credential referenced from a client module");
              }
            });
          }

          roots.forEach(walk);

          if (findings.length) {
            console.error("Project security invariants failed with " + findings.length + " finding(s).");
            for (const finding of findings) {
              const detail = finding.detail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.error(
                "::error file=" + finding.file + ",line=" + finding.line + ",title=" + finding.rule + "::" + detail,
              );
            }
            process.exit(1);
          }

          console.log("Project security invariants passed.");
          NODE

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-audit:
    name: Dependency audit (npm advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile state
        run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Verify Python 3.12
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --version
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejsscan \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            .
      - name: Upload Semgrep SARIF artifact
        id: upload-semgrep-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v6.0.0
        with:
          name: semgrep-sarif-${{ github.run_id }}-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}
      - name: Summarize and enforce Semgrep error-level gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
          SUMMARY_TOP_N: ${{ env.SARIF_SUMMARY_TOP_N }}
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import sys

          if os.environ.get("SCAN_OUTCOME") != "success":
              print("::error::Semgrep scanner/configuration failed. Review the scan log.")
              sys.exit(1)

          if not os.path.exists("semgrep.sarif") or os.path.getsize("semgrep.sarif") == 0:
              print("::error::Semgrep completed without producing semgrep.sarif.")
              sys.exit(1)

          with open("semgrep.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)

          findings = []
          offenders = []
          counts = collections.Counter()

          for run in sarif.get("runs", []):
              rules = run.get("tool", {}).get("driver", {}).get("rules", [])
              levels = {
                  rule.get("id"): (rule.get("defaultConfiguration") or {}).get("level", "warning")
                  for rule in rules
              }
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "unknown-rule")
                  level = result.get("level") or levels.get(rule_id, "warning")
                  message = (result.get("message") or {}).get("text", "Semgrep finding")
                  locations = result.get("locations") or []
                  uri = ""
                  line = ""
                  if locations:
                      physical = locations[0].get("physicalLocation") or {}
                      uri = (physical.get("artifactLocation") or {}).get("uri", "")
                      line = (physical.get("region") or {}).get("startLine", "")
                  findings.append((rule_id, level, uri, line, message))
                  counts[(rule_id, level)] += 1
                  if level == "error":
                      offenders.append((rule_id, uri, line, message))

          top_n = max(1, int(os.environ.get("SUMMARY_TOP_N", "10")))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write("## Semgrep findings\n\n")
                  if not findings:
                      out.write("Semgrep: 0 findings.\n")
                  else:
                      out.write("| Rule | Level | Count |\n| --- | --- | ---: |\n")
                      for (rule_id, level), count in counts.most_common(top_n):
                          out.write("| " + rule_id.replace("|", "\\|") + " | " + level + " | " + str(count) + " |\n")

          rank = {"error": 0, "warning": 1, "note": 2}
          for rule_id, level, uri, line, message in sorted(
              findings, key=lambda item: rank.get(item[1], 3)
          )[:top_n]:
              command = "error" if level == "error" else "warning"
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              location = ""
              if uri and line:
                  location = " file=" + str(uri) + ",line=" + str(line)
              print("::" + command + location + ",title=Semgrep " + rule_id + "::" + escaped)

          if offenders:
              print("::error::Semgrep found " + str(len(offenders)) + " error-level finding(s).")
              sys.exit(1)

          print("Semgrep gate passed: no error-level findings.")
          PY
