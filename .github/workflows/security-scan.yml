name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  SARIF_RETENTION_DAYS: ${{ vars.SARIF_RETENTION_DAYS || '14' }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Project security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify project security invariants
        run: node scripts/verify-security-invariants.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" -o "/tmp/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current working tree for secrets
        id: gitleaks_current
        shell: bash
        run: |
          set +e
          gitleaks dir . \
            --no-banner \
            --redact=100 \
            --report-format sarif \
            --report-path results-current.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan new commit range for secrets
        id: gitleaks_incremental
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          zeros="0000000000000000000000000000000000000000"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$zeros" ]; then
            range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            range="HEAD"
          fi
          echo "Scanning commit range: $range"
          gitleaks git . \
            --no-banner \
            --redact=100 \
            --log-opts="$range --diff-filter=tuxdb" \
            --report-format sarif \
            --report-path results-incremental.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit full Git history for legacy secret findings
        id: gitleaks_history
        shell: bash
        run: |
          set +e
          gitleaks git . \
            --no-banner \
            --redact=100 \
            --report-format sarif \
            --report-path results-history.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -s results-history.sarif ]; then
            count="$(jq '[.runs[]?.results[]?] | length' results-history.sarif)"
          else
            count=0
          fi
          echo "finding_count=$count" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce current and incremental secret gates
        shell: bash
        env:
          CURRENT_EXIT: ${{ steps.gitleaks_current.outputs.exit_code }}
          INCREMENTAL_EXIT: ${{ steps.gitleaks_incremental.outputs.exit_code }}
          HISTORY_EXIT: ${{ steps.gitleaks_history.outputs.exit_code }}
          HISTORY_COUNT: ${{ steps.gitleaks_history.outputs.finding_count }}
        run: |
          set -euo pipefail
          for pair in "current:$CURRENT_EXIT" "incremental:$INCREMENTAL_EXIT"; do
            name="${pair%%:*}"
            code="${pair##*:}"
            if [ "$code" = "1" ]; then
              echo "::error::Gitleaks found secret-pattern findings in the $name scan."
              exit 1
            fi
            if [ "$code" != "0" ]; then
              echo "::error::Gitleaks $name scan failed with exit code $code."
              exit 1
            fi
          done
          if [ "$HISTORY_EXIT" = "1" ]; then
            echo "::warning::Legacy Git history contains $HISTORY_COUNT secret-pattern finding(s). Current/new-change gates are clean; historical remediation remains tracked separately."
          elif [ "$HISTORY_EXIT" != "0" ]; then
            echo "::error::Gitleaks full-history audit failed with exit code $HISTORY_EXIT."
            exit 1
          fi

      - name: Upload gitleaks SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: gitleaks-sarif-${{ github.run_id }}-${{ github.sha }}
          path: |
            results-current.sarif
            results-incremental.sarif
            results-history.sarif
          if-no-files-found: warn
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}

  dependency-audit:
    name: Dependency audit (npm advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high

  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python 3.12
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --version
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejsscan \
            --config p/secrets \
            --exclude apps/ronsas/syncvision/public/ffmpeg-core/ffmpeg-core.js \
            --sarif \
            --output semgrep.sarif \
            .
      - name: Upload Semgrep SARIF artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: semgrep-sarif-${{ github.run_id }}-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}
      - name: Enforce Semgrep error-level gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          set -euo pipefail
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error::Semgrep scanner/configuration failed. Review the scan log."
            exit 1
          fi
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep completed without producing semgrep.sarif."
            exit 1
          fi
          python - <<'PY'
          import json
          import sys

          with open("semgrep.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)

          offenders = []
          for run in sarif.get("runs", []):
              rules = run.get("tool", {}).get("driver", {}).get("rules", [])
              levels = {
                  rule.get("id"): (rule.get("defaultConfiguration") or {}).get("level", "warning")
                  for rule in rules
              }
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "unknown-rule")
                  level = result.get("level") or levels.get(rule_id, "warning")
                  if level != "error":
                      continue
                  message = (result.get("message") or {}).get("text", "Semgrep error-level finding")
                  locations = result.get("locations") or []
                  uri = ""
                  line = ""
                  if locations:
                      physical = locations[0].get("physicalLocation") or {}
                      uri = (physical.get("artifactLocation") or {}).get("uri", "")
                      line = (physical.get("region") or {}).get("startLine", "")
                  offenders.append((rule_id, uri, line, message))

          if offenders:
              print(f"::error::Semgrep found {len(offenders)} error-level finding(s).")
              for rule_id, uri, line, message in offenders:
                  location = f" file={uri},line={line}" if uri and line else ""
                  print(f"::error{location}::{rule_id}: {message}")
              sys.exit(1)

          print("Semgrep: no error-level findings; warning-level findings remain visible in SARIF.")
          PY

  gate-timeframe:
    name: DataNest AI worktree gate timeframe
    uses: ./.github/workflows/worktree-gate-timeframe.yml
    with:
      gate_id: "security-scan"
