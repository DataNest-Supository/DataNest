          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_sovereign_governance_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_project_member_invitations_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_file_ingestion_acceptance.sql

      - name: Seed governed E2E fixtures
        run: npm run seed:e2e:datanest-ai

      - name: Run candidate backend acceptance
        env:
          DATANEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
