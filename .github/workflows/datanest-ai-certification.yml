name: DataNest AI Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datanest-ai-certification-staging
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      # Supabase publishable client configuration is intentionally public.
      # Only the service-role key and Postgres database password remain GitHub secrets.
      DATANEST_AI_STAGING_URL: https://qchttpcyqlqnhvahprhz.supabase.co
      DATANEST_AI_STAGING_PUBLISHABLE_KEY: sb_publishable_spZZYssbgfnC0qecAPLPVQ_ZqAyugqS
      DATANEST_AI_STAGING_SERVICE_ROLE_KEY: ${{ secrets.DATANEST_AI_STAGING_SERVICE_ROLE_KEY }}
      DATANEST_AI_STAGING_DB_PASSWORD: ${{ secrets.DATANEST_AI_STAGING_DB_PASSWORD }}
      PGHOST: aws-0-eu-central-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.qchttpcyqlqnhvahprhz
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - name: Determine canonical certification applicability
        id: applicability
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          applicable=false
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/sec01-governance-certification.yml|config/worktree-gate-timeframes.json|docs/reviews/*sec01*|supabase/migrations/*governance*|tests/sql/datanest_sovereign_governance_acceptance.sql|tests/stress/datanest-governance-boundary-acceptance.mjs|tests/unit/worktree-gate-timeframes.test.mjs)
                ;;
              *)
                applicable=true
                break
                ;;
            esac
          done
          if [ "${#changed[@]}" -eq 0 ]; then
            applicable=true
          fi
          echo "applicable=$applicable" >> "$GITHUB_OUTPUT"
          if [ "$applicable" = "true" ]; then
            echo "reason=canonical-data-plane-or-unknown-scope-change" >> "$GITHUB_OUTPUT"
          else
            echo "reason=canonical-governance-only-change" >> "$GITHUB_OUTPUT"
          fi

      - name: Record explicit non-applicability
        if: steps.applicability.outputs.applicable != 'true'
        shell: bash
        run: |
          mkdir -p certification-artifacts
          node -e 'const fs=require("fs"); fs.writeFileSync("certification-artifacts/datanest-ai-certification.json", JSON.stringify({
            commit:process.env.DATANEST_CERTIFICATION_CANDIDATE_SHA,
            candidateCommit:process.env.DATANEST_CERTIFICATION_CANDIDATE_SHA,
            status:"not-applicable",
            reason:process.env.DATANEST_AI_CERTIFICATION_NON_APPLICABLE_REASON,
            target:"canonical-governance",
            mirrorStagingUsed:false,
            productionMutated:false,
            completedAt:new Date().toISOString()
          })+"\n")'
        env:
          DATANEST_AI_CERTIFICATION_NON_APPLICABLE_REASON: ${{ steps.applicability.outputs.reason }}
          DATANEST_CERTIFICATION_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create ephemeral governed E2E credentials
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          echo "DATANEST_AI_E2E_EMAIL=datanest-ai-e2e@resonance.invalid" >> "$GITHUB_ENV"
          PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$PASSWORD"
          echo "DATANEST_AI_E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Validate governed staging configuration
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          test -n "$DATANEST_AI_STAGING_URL" || { echo "DATANEST_AI_STAGING_URL is required"; exit 1; }
          test -n "$DATANEST_AI_STAGING_PUBLISHABLE_KEY" || { echo "DATANEST_AI_STAGING_PUBLISHABLE_KEY is required"; exit 1; }
          test -n "$DATANEST_AI_STAGING_SERVICE_ROLE_KEY" || { echo "DATANEST_AI_STAGING_SERVICE_ROLE_KEY is required"; exit 1; }
          test -n "$DATANEST_AI_STAGING_DB_PASSWORD" || { echo "DATANEST_AI_STAGING_DB_PASSWORD is required"; exit 1; }
          test -n "$DATANEST_AI_E2E_EMAIL" || { echo "DATANEST_AI_E2E_EMAIL is required"; exit 1; }
          test -n "$DATANEST_AI_E2E_PASSWORD" || { echo "DATANEST_AI_E2E_PASSWORD is required"; exit 1; }

      - name: Run staging schema acceptance
        if: steps.applicability.outputs.applicable == 'true'
        env:
          PGPASSWORD: ${{ env.DATANEST_AI_STAGING_DB_PASSWORD }}
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_staging_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_production_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_contribution_intelligence_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_think_tanks_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_sparks_economy_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_sovereign_governance_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_project_member_invitations_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_file_ingestion_acceptance.sql

      - name: Seed governed E2E fixtures
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run seed:e2e:datanest-ai

      - name: Run candidate backend acceptance
        if: steps.applicability.outputs.applicable == 'true'
        env:
          DATANEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/stress/datanest-ai-backend-acceptance.mjs

      - name: Build static DataNest against governed staging
        if: steps.applicability.outputs.applicable == 'true'
        env:
          DATANEST_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.DATANEST_AI_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_AI_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ env.DATANEST_AI_STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_AI_STAGING_PUBLISHABLE_KEY }}
          DATANEST_RELEASE_SHA: ${{ github.sha }}
          DATANEST_DB_RELEASE: datanest-project-member-invitations-v1
          DATANEST_EDGE_AI: datanest-ai-chat@2
          DATANEST_EDGE_INTAKE: datanest-ai-intake@1
          DATANEST_EDGE_CERTIFICATION: datanest-ai-certification@1
          DATANEST_EDGE_PROVIDER: manage-ai-provider-v2@1
          DATANEST_EDGE_INVITES: send-job-invite@1
          DATANEST_EDGE_PROJECT_INVITES: send-project-member-invite@3
        run: |
          node scripts/write-runtime-config.mjs public/runtime-config.js
          node scripts/write-release-manifest.mjs public/release-manifest.json
          npm run build

      - name: Install Chromium
        if: steps.applicability.outputs.applicable == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run governed browser acceptance
        if: steps.applicability.outputs.applicable == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          DATANEST_APP_PATH: /
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out >/tmp/datanest-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null || {
            cat /tmp/datanest-ai-http.log
            exit 1
          }
          npm run test:browser:datanest-ai -- --workers=1

      - name: Run governed file worker durability stress
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:stress:datanest-ai-files

      - name: Run governed stress acceptance
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:stress:datanest-ai

      - name: Write certification evidence
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          mkdir -p certification-artifacts
          node -e 'const fs=require("fs"); fs.writeFileSync("certification-artifacts/datanest-ai-certification.json", JSON.stringify({commit:process.env.GITHUB_SHA,status:"passed",suite:"datanest-project-member-invitations-v1",completedAt:new Date().toISOString()})+"\n")'

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-ai-certification-${{ github.sha }}
          path: certification-artifacts/datanest-ai-certification.json
          if-no-files-found: error

      - name: Preserve backend acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-ai-backend-acceptance-${{ github.sha }}
          path: certification-artifacts/datanest-ai-backend-acceptance.json
          if-no-files-found: warn
          retention-days: 7

  gate-timeframe:
    name: DataNest AI worktree gate timeframe
    uses: ./.github/workflows/worktree-gate-timeframe.yml
    with:
      gate_id: "datanest-ai-certification"
      - name: Create ephemeral governed E2E credentials
        shell: bash
        run: |
          echo "DATANEST_AI_E2E_EMAIL=datanest-ai-e2e@resonance.invalid" >> "$GITHUB_ENV"
          PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$PASSWORD"
          echo "DATANEST_AI_E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

