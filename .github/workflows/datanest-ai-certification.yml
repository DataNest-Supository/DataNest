          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_AI_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ env.DATANEST_AI_STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_AI_STAGING_PUBLISHABLE_KEY }}
          DATANEST_RELEASE_SHA: ${{ github.sha }}
          DATANEST_DB_RELEASE: datanest-project-member-invitations-v1
          DATANEST_EDGE_AI: datanest-ai-chat@2
          DATANEST_EDGE_INTAKE: datanest-ai-intake@1
          DATANEST_EDGE_CERTIFICATION: datanest-ai-certification@1
          DATANEST_EDGE_PROVIDER: manage-ai-provider-v2@1
          DATANEST_EDGE_INVITES: send-job-invite@1
          DATANEST_EDGE_PROJECT_INVITES: send-project-member-invite@3
        run: |
          node scripts/write-runtime-config.mjs public/runtime-config.js
          node scripts/write-release-manifest.mjs public/release-manifest.json
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run governed browser acceptance
        env:
