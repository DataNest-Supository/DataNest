name: DataNest AI Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datanest-ai-certification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      # Canonical DataNest is multi-collaborator. Certification runs against an
      # isolated local Supabase stack replayed from the exact candidate migrations,
      # never against Mirror-DataNest's single-owner R&D staging boundary.
      DATANEST_CERTIFICATION_TARGET: local-canonical
      DATANEST_AI_E2E_EMAIL: datanest-ai-e2e@resonance.invalid
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Create ephemeral governed E2E credentials
        shell: bash
        run: |
          PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$PASSWORD"
          echo "DATANEST_AI_E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Start isolated canonical Supabase certification stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase status -o env > /tmp/datanest-supabase.env
          set -a
          source /tmp/datanest-supabase.env
          set +a

          for name in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            test -n "${!name:-}" || { echo "::error::Supabase local status did not provide $name"; exit 1; }
          done

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "DATANEST_CERTIFICATION_URL=$API_URL"
            echo "DATANEST_CERTIFICATION_PUBLISHABLE_KEY=$ANON_KEY"
            echo "DATANEST_CERTIFICATION_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATANEST_CERTIFICATION_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

          nohup supabase functions serve > /tmp/datanest-functions.log 2>&1 &
          echo $! > /tmp/datanest-functions.pid

          ready=false
          for attempt in {1..45}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST "$API_URL/functions/v1/datanest-ai-chat" \
              --header "apikey: $ANON_KEY" \
              --header "Authorization: Bearer $ANON_KEY" \
              --header "Content-Type: application/json" \
              --data '{}' || true)"
            if [ "$code" != "000" ] && [ "$code" != "404" ]; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Local Edge Functions did not become reachable."
            tail -n 200 /tmp/datanest-functions.log || true
            exit 1
          fi

      - name: Validate isolated certification configuration
        shell: bash
        run: |
          test "$DATANEST_CERTIFICATION_TARGET" = "local-canonical"
          test -n "$DATANEST_CERTIFICATION_URL"
          test -n "$DATANEST_CERTIFICATION_PUBLISHABLE_KEY"
          test -n "$DATANEST_CERTIFICATION_SERVICE_ROLE_KEY"
          test -n "$DATANEST_CERTIFICATION_DB_URL"
          test -n "$DATANEST_AI_E2E_EMAIL"
          test -n "$DATANEST_AI_E2E_PASSWORD"
          node -e 'const u=new URL(process.env.DATANEST_CERTIFICATION_URL); if(!["127.0.0.1","localhost"].includes(u.hostname)) throw new Error("Certification target must be loopback-local.");'

      - name: Run canonical schema acceptance
        shell: bash
        run: |
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_staging_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_production_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_contribution_intelligence_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_think_tanks_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_sparks_economy_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_sovereign_governance_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_project_member_invitations_acceptance.sql
          psql "$DATANEST_CERTIFICATION_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_file_ingestion_acceptance.sql

      - name: Seed governed E2E fixtures
        run: npm run seed:e2e:datanest-ai

      - name: Run governance authorization boundary acceptance
        env:
          DATANEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/stress/datanest-governance-boundary-acceptance.mjs

      - name: Run candidate backend acceptance
        env:
          DATANEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/stress/datanest-ai-backend-acceptance.mjs

      - name: Build static DataNest against isolated canonical stack
        env:
          DATANEST_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.DATANEST_CERTIFICATION_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_CERTIFICATION_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ env.DATANEST_CERTIFICATION_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.DATANEST_CERTIFICATION_PUBLISHABLE_KEY }}
          DATANEST_RELEASE_SHA: ${{ github.sha }}
          DATANEST_DB_RELEASE: datanest-local-canonical-certification-v1
          DATANEST_EDGE_AI: datanest-ai-chat@2
          DATANEST_EDGE_INTAKE: datanest-ai-intake@1
          DATANEST_EDGE_CERTIFICATION: datanest-ai-certification@1
          DATANEST_EDGE_PROVIDER: manage-ai-provider-v2@1
          DATANEST_EDGE_INVITES: send-job-invite@1
          DATANEST_EDGE_PROJECT_INVITES: send-project-member-invite@3
        run: |
          node scripts/write-runtime-config.mjs public/runtime-config.js
          node scripts/write-release-manifest.mjs public/release-manifest.json
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run governed browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          DATANEST_APP_PATH: /
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out >/tmp/datanest-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null || {
            cat /tmp/datanest-ai-http.log
            exit 1
          }
          npm run test:browser:datanest-ai -- --workers=1

      - name: Run governed file worker durability stress
        run: npm run test:stress:datanest-ai-files

      - name: Run governed stress acceptance
        run: npm run test:stress:datanest-ai

      - name: Write certification evidence
        shell: bash
        run: |
          mkdir -p certification-artifacts
          node -e 'const fs=require("fs"); fs.writeFileSync("certification-artifacts/datanest-ai-certification.json", JSON.stringify({commit:process.env.GITHUB_SHA,status:"passed",suite:"datanest-local-canonical-certification-v1",target:"local-canonical",completedAt:new Date().toISOString()})+"\n")'

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-ai-certification-${{ github.sha }}
          path: certification-artifacts/datanest-ai-certification.json
          if-no-files-found: error

      - name: Preserve governance boundary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-governance-boundary-acceptance-${{ github.sha }}
          path: certification-artifacts/datanest-governance-boundary-acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve backend acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-ai-backend-acceptance-${{ github.sha }}
          path: certification-artifacts/datanest-ai-backend-acceptance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve local certification diagnostics
        if: failure()
        shell: bash
        run: |
          echo "### Local Edge Function log tail"
          tail -n 250 /tmp/datanest-functions.log || true
          echo "### Local Supabase status"
          supabase status || true

      - name: Stop isolated canonical Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  gate-timeframe:
    name: DataNest AI worktree gate timeframe
    uses: ./.github/workflows/worktree-gate-timeframe.yml
    with:
      gate_id: "datanest-ai-certification"
