          test -n "$DATANEST_AI_STAGING_DB_PASSWORD" || { echo "DATANEST_AI_STAGING_DB_PASSWORD is required"; exit 1; }
          test -n "$DATANEST_AI_E2E_EMAIL" || { echo "DATANEST_AI_E2E_EMAIL is required"; exit 1; }
