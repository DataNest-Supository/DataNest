        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_staging_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_ai_production_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_contribution_intelligence_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/datanest_think_tanks_acceptance.sql
