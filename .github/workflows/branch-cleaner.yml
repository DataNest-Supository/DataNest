name: Branch-Cleaner

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only branches classified as safe delete candidates
        required: true
        default: false
        type: boolean
      strict:
        description: Fail when control-plane blockers are detected
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Run Branch-Cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="$ARGS --strict"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/branch-cleaner.mjs $ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: branch-cleaner-report
          path: artifacts/branch-cleaner/
          if-no-files-found: warn
