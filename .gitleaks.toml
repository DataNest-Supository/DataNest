title = "DataNest Gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable client keys are intentionally public and remain constrained by RLS."
targetRules = ["generic-api-key"]
regexes = [
  '''^sb_publishable_[A-Za-z0-9_-]+$'''
]

[[allowlists]]
description = "SyncVision billing reminder localStorage key is an application storage identifier, not authentication material."
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^apps/ronsas/syncvision/src/lib/billingReminder\.ts$'''
]
regexTarget = "line"
regexes = [
  '''merge\.billingReminder\.v1'''
]

[[allowlists]]
description = "Historical external-AI trace-key fixture from one unit-test commit; not authentication material."
targetRules = ["generic-api-key"]
condition = "AND"
commits = [
  "7ac61b91756d23a0061c2ef98ce45bf161edabf7"
]
paths = [
  '''^tests/unit/external-ai-return\.test\.mjs$'''
]
regexTarget = "line"
regexes = [
  '''(?i)expectedTraceKey:\s*"[A-Za-z0-9_-]*trace[A-Za-z0-9_-]*"'''
]
